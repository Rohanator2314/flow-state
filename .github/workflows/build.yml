name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: flow-state-macos-arm64
            asset: flow-state-macos-arm64.tar.gz

          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: flow-state-linux-x64
            asset: flow-state-linux-x64.tar.gz

          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: flow-state-windows-x64.msi

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --release --target ${{ matrix.target }} -- --skip core::latex::tests

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install MSI tooling
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "${{ matrix.artifact }}.tar.gz" \
            flow-state

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo wix `
            --no-build `
            --target "${{ matrix.target }}" `
            --output "${{ matrix.asset }}" `
            --nocapture

      - name: Verify Windows Start Menu registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "${{ matrix.asset }}").Path
          $install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin 0, 3010) {
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }

          try {
            $programs = [Environment]::GetFolderPath(
              [Environment+SpecialFolder]::CommonPrograms
            )
            $shortcut = Join-Path $programs "Flow State.lnk"
            if (-not (Test-Path $shortcut)) {
              throw "MSI did not create the Start Menu shortcut at $shortcut"
            }

            $shell = New-Object -ComObject WScript.Shell
            $target = $shell.CreateShortcut($shortcut).TargetPath
            $expected = Join-Path $env:ProgramFiles "Flow State\bin\flow-state.exe"
            if ($target -ne $expected) {
              throw "Start Menu shortcut targets '$target', expected '$expected'"
            }
          }
          finally {
            $uninstall = Start-Process msiexec.exe `
              -ArgumentList "/x `"$msi`" /qn /norestart" `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -notin 0, 3010) {
              throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
            }
          }

      - name: Upload build to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
