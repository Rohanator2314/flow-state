name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: flow-state-macos-arm64

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: flow-state-macos-x64

          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: flow-state-windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "${{ matrix.artifact }}.tar.gz" \
            flow-state

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\flow-state.exe" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 1
