name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: flow-state-macos-arm64
            asset: flow-state-macos-arm64.tar.gz

          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: flow-state-linux-x64
            asset: flow-state-linux-x64.tar.gz

          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: flow-state-windows-x64
            asset: flow-state-windows-x64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --release --target ${{ matrix.target }} -- --skip core::latex::tests

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "${{ matrix.artifact }}.tar.gz" \
            flow-state

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\flow-state.exe" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
