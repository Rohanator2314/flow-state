name: Build Windows MSI

run-name: Build Windows MSI from ${{ inputs.build_ref }} for ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Git ref or commit to build
        required: true
        type: string
      release_tag:
        description: Existing GitHub Release tag whose MSI should be replaced
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref }}

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -- --skip core::latex::tests

      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Install MSI tooling
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build Windows installer
        shell: pwsh
        run: |
          cargo wix `
            --no-build `
            --target "x86_64-pc-windows-msvc" `
            --output "flow-state-windows-x64.msi" `
            --nocapture

      - name: Verify Windows Start Menu registration
        shell: pwsh
        run: |
          $msi = (Resolve-Path "flow-state-windows-x64.msi").Path
          $install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin 0, 3010) {
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }

          try {
            $programs = [Environment]::GetFolderPath(
              [Environment+SpecialFolder]::CommonPrograms
            )
            $shortcut = Join-Path $programs "Flow State.lnk"
            if (-not (Test-Path $shortcut)) {
              throw "MSI did not create the Start Menu shortcut at $shortcut"
            }

            $shell = New-Object -ComObject WScript.Shell
            $target = $shell.CreateShortcut($shortcut).TargetPath
            $expected = Join-Path $env:ProgramFiles "Flow State\bin\flow-state.exe"
            if ($target -ne $expected) {
              throw "Start Menu shortcut targets '$target', expected '$expected'"
            }
          }
          finally {
            $uninstall = Start-Process msiexec.exe `
              -ArgumentList "/x `"$msi`" /qn /norestart" `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -notin 0, 3010) {
              throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
            }
          }

      - name: Upload MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          "${{ inputs.release_tag }}"
          flow-state-windows-x64.msi
          --clobber
